services:
  # DATABASE
  database:
    image: mysql:8.0
    container_name: db_sdn
    restart: on-failure
    volumes:
      - volume-sdn:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=sdn_controller
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - 3306:3306
    networks:
      - network-sdn

  # PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_sdn
    restart: on-failure
    environment:
      - PMA_ARBITRARY=1
    ports:
      - 5000:80
    depends_on:
      - database
    networks:
      - network-sdn

volumes:
  volume-sdn:
    name: volume-sdn

networks:
  network-sdn:
    name: network-sdn
