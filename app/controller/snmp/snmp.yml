auths:
  public_v1:
    community: public
    # security_level: noAuthNoPriv
    # auth_protocol: MD5
    # priv_protocol: DES
    version: 1
  public_v2:
    community: public
    # security_level: noAuthNoPriv
    # auth_protocol: MD5
    # priv_protocol: DES
    version: 2
  cisco_public:
    community: public
    # security_level: noAuthNoPriv
    # auth_protocol: MD5
    # priv_protocol: DES
    version: 2
  mikrotik_public:
    community: public
    # security_level: noAuthNoPriv
    # auth_protocol: MD5
    # priv_protocol: DES
    version: 2
modules:
  mikrotik:
    walk:
      - 1.3.6.1.2.1.31.1.1.1.1
      - 1.3.6.1.4.1.14988
      - 1.3.6.1.2.1
    metrics:
      - name: SystemIdentity
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString
      - name: CPU
        oid: 1.3.6.1.2.1.25.3.3.1.2.1
        type: gauge
      - name: FirmwareVersion
        oid: 1.3.6.1.4.1.14988.1.1.4.4.0
        type: DisplayString
      - name: HardwareModel
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
      - name: SerialNumber
        oid: 1.3.6.1.4.1.14988.1.1.7.3.0
        type: DisplayString
      - name: DeviceModel
        oid: 1.3.6.1.4.1.14988.1.1.7.9.0
        type: DisplayString
      - name: DeviceBoard
        oid: 1.3.6.1.4.1.14988.1.1.7.8.0
        type: DisplayString
      - name: DeviceTemperature
        oid: 1.3.6.1.4.1.14988.1.1.3.10.0
        type: gauge
      - name: SystemUptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
      - name: TotalRAM
        oid: 1.3.6.1.2.1.25.2.3.1.5.65536
        type: gauge
        help: Total RAM dalam blok (allocation unit = 1024 byte)
      - name: UsedRAM
        oid: 1.3.6.1.2.1.25.2.3.1.6.65536
        type: gauge
        help: RAM yang terpakai dalam blok (allocation unit = 1024 byte)
      - name: TotalStorage
        oid: 1.3.6.1.2.1.25.2.3.1.5.131072
        type: gauge
        help: Total Storage/Flash (allocation unit = 1024 byte)
      - name: UsedStorage
        oid: 1.3.6.1.2.1.25.2.3.1.6.131072
        type: gauge
        help: Storage/Flash yang terpakai (allocation unit = 1024 byte)
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Bytes received per interface (64-bit counter)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Bytes sent per interface (64-bit counter)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: InterfaceMAC
        oid: 1.3.6.1.2.1.2.2.1.6
        type: OctetString
        help: Mac Address Interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: InterfaceType
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: Type Interface 6=interface 135=vlan 209=bridge
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: InterfaceStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: counter
        help: Status Interface 1=up, 2=down
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: InterfaceDescription
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: Interface Status
      - name: ifMtu
        oid: 1.3.6.1.2.1.2.2.1.4
        type: gauge
        help: Maximum transmission unit of the interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifLastChange
        oid: 1.3.6.1.2.1.2.2.1.9
        type: gauge
        help: Time since interface last changed state (Timeticks)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Number of inbound packets that contained errors
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Number of outbound packets that contained errors
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: Number of inbound packets discarded
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: Number of outbound packets discarded
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
  unifi:
    walk:
      - 1.3.6.1.2.1.1 # system
      - 1.3.6.1.2.1.2 # interface
      - 1.3.6.1.2.1.25 # hrSystem
      - 1.3.6.1.4.1.2021 # cpu & memory
      - 1.3.6.1.4.1.41112 # unifi private mib
    metrics:
      - name: SystemName
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString
      - name: SystemUptime
        oid: 1.3.6.1.2.1.25.1.1.0
        type: gauge
      - name: FirmwareVersion
        oid: 1.3.6.1.4.1.41112.1.6.3.6.0
        type: DisplayString
      - name: HardwareModel
        oid: 1.3.6.1.4.1.41112.1.6.3.3.0
        type: DisplayString
      - name: SystemIPAddress
        oid: 1.3.6.1.4.1.41112.1.6.3.1.0
        type: DisplayString
      - name: SystemMacAddress
        oid: 1.3.6.1.4.1.41112.1.6.2.1.1.4.1
        type: OctetString
      - name: cpuLoad1m
        oid: 1.3.6.1.4.1.2021.10.1.6.1
        type: gauge
        help: CPU load 1 minute average
      - name: cpuLoad5m
        oid: 1.3.6.1.4.1.2021.10.1.6.2
        type: gauge
        help: CPU load 5 minute average
      - name: cpuLoad15m
        oid: 1.3.6.1.4.1.2021.10.1.6.3
        type: gauge
        help: CPU load 15 minute average
      - name: memTotal
        oid: 1.3.6.1.4.1.2021.4.5.0
        type: gauge
        help: Total memory
      - name: memAvailable
        oid: 1.3.6.1.4.1.2021.4.6.0
        type: gauge
        help: Available memory
      - name: memUsed
        oid: 1.3.6.1.4.1.2021.4.15.0
        type: gauge
        help: Used memory
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: Bytes received per interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: Bytes sent per interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Bytes received per interface (64-bit)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Bytes sent per interface (64-bit)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Interface operational status (1=up,2=down)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifType
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: Interface type (6=ethernet,24=loopback)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifMtu
        oid: 1.3.6.1.2.1.2.2.1.4
        type: gauge
        help: Maximum transmission unit of the interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifLastChange
        oid: 1.3.6.1.2.1.2.2.1.9
        type: gauge
        help: Time since interface last changed state (Timeticks)
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Number of inbound packets that contained errors
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Number of outbound packets that contained errors
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: Number of inbound packets discarded
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: Number of outbound packets discarded
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: InterfaceMAC
        oid: 1.3.6.1.2.1.2.2.1.6
        type: OctetString
        help: Mac Address per interface
        indexes:
          - labelname: InterfaceIndex
            type: gauge
        lookups:
          - labels:
              - InterfaceIndex
            labelname: ifName
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

  cisco:
    walk:
      # Standard MIB
      - 1.3.6.1.2.1.1 # system
      - 1.3.6.1.2.1.2 # interfaces
      - 1.3.6.1.2.1.17 # bridge
      - 1.3.6.1.2.1.31 # ifXTable
      - 1.3.6.1.2.1.47 # entity (hardware info)

      # Cisco Enterprise
      - 1.3.6.1.4.1.9
      - 1.3.6.1.4.1.9.9.23 # VLAN name
      - 1.3.6.1.4.1.9.9.46 # VLAN info

    metrics:
      # ======================
      # SYSTEM INFORMATION
      - name: cisco_system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString

      - name: cisco_system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: Uptime perangkat (timeticks)

      - name: cisco_system_name
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString

      - name: cisco_device_status
        oid: 1.3.6.1.4.1.9.2.1.2.0
        type: gauge
        help: Status perangkat Cisco (vendor specific)

      - name: cisco_hostname
        oid: 1.3.6.1.2.1.47.1.1.1.1.7.1
        type: DisplayString

      - name: cisco_short_description
        oid: 1.3.6.1.2.1.47.1.1.1.1.2.1
        type: DisplayString

      - name: cisco_hardware_model
        oid: 1.3.6.1.2.1.47.1.1.1.1.13.1
        type: DisplayString

      - name: cisco_software_version
        oid: 1.3.6.1.2.1.47.1.1.1.1.9.1
        type: DisplayString

      - name: cisco_serial_number
        oid: 1.3.6.1.2.1.47.1.1.1.1.11.1
        type: DisplayString

      - name: cisco_base_mac
        oid: 1.3.6.1.2.1.17.1.1.0
        type: OctetString
        help: MAC address utama perangkat

      # ======================
      # INTERFACE INFORMATION
      - name: cisco_interface_name
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_interface_type
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: Tipe interface (6=ethernet, 135=vlan)
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_interface_status
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: 1=up, 2=down
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString

      - name: cisco_interface_speed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: Kecepatan interface (bps)
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_interface_mac
        oid: 1.3.6.1.2.1.2.2.1.6
        type: OctetString
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_if_in_bytes
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: Incoming bytes (since boot)
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_if_out_bytes
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: Outgoing bytes (since boot)
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_if_in_packets
        oid: 1.3.6.1.2.1.2.2.1.11
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_if_out_packets
        oid: 1.3.6.1.2.1.2.2.1.17
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: cisco_if_bits_sent
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter64
        help: Bits sent (high capacity)
        indexes:
          - labelname: ifIndex
            type: gauge

      # ======================
      # VLAN INFORMATION
      - name: cisco_vlan_id
        oid: 1.3.6.1.4.1.9.9.46.1.3.1.1.4
        type: gauge
        indexes:
          - labelname: vlanIndex
            type: gauge

      - name: cisco_vlan_name
        oid: 1.3.6.1.4.1.9.9.23.1.2.1.1.7
        type: DisplayString
        indexes:
          - labelname: vlanIndex
            type: gauge
