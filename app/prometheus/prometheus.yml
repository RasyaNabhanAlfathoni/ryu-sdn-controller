global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "snmp"
    metrics_path: /snmp
    file_sd_configs:
      - files:
          - snmp_targets.json
    relabel_configs:
      - source_labels: [id]
        target_label: device_id
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [community]
        regex: public
        replacement: cisco_public
        target_label: __param_auth
      # DROP label community agar tidak ikut ke request
      - regex: community
        action: labeldrop
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp_exporter:9116

  # Node Exporter - Dynamic via Controller API
  - job_name: "node-exporter-servers"
    file_sd_configs:
      - files:
          - server_targets.json # File yang digenerate controller
        refresh_interval: 30s
    scrape_interval: 15s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [hostname]
        target_label: hostname
      - source_labels: [device_id]
        target_label: device_id
      - source_labels: [os]
        target_label: os
      - source_labels: [vendor]
        target_label: vendor
