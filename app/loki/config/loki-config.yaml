auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 0.0.0.0
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# INGESTER SETTINGS
ingester:
  chunk_idle_period: 3m           # Lebih panjang untuk log router
  chunk_target_size: 1048576       # 1MB per chunk
  max_chunk_age: 10m              # Max 10 menit di memory
  lifecycler:
    ring:
      replication_factor: 1

# RETENTION
limits_config:
  retention_period: 72h # 3 hari
  max_query_lookback: 72h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

# SCHEMA
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# TABLE MANAGER
table_manager:
  retention_deletes_enabled: true
  retention_period: 72h

# CHUNK STORE
chunk_store_config:
  max_look_back_period: 72h

# COMPACTOR
compactor:
  working_directory: /tmp/loki/compactor
  compaction_interval: 30m
  retention_enabled: true