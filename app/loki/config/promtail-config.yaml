server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: debug

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: router-syslog
    syslog:
      listen_address: 0.0.0.0:1510
      listen_protocol: udp
      idle_timeout: 60s
      syslog_format: rfc3164
      label_structured_data: false
      labels:
        job: "router"
        service_name: "router"
        component: "router"
    relabel_configs:
      - source_labels: ["__syslog_connection_ip_address"]
        target_label: "source_address"

      - source_labels: ["__syslog_message_hostname"]
        target_label: "hostname"

      - source_labels: ["__syslog_message_severity"]
        target_label: "level"

      - source_labels: ["__syslog_message_facility"]
        target_label: "syslog_facility"

  - job_name: unifi_access_point-syslog
    syslog:
      listen_address: 0.0.0.0:1512
      listen_protocol: udp
      idle_timeout: 60s
      syslog_format: rfc3164
      label_structured_data: false
      labels:
        job: "unifi_access_point"
        service_name: "unifi_access_point"
        component: "access_point"
    relabel_configs:
      - source_labels: ["__syslog_connection_ip_address"]
        target_label: "source_address"

      - source_labels: ["__syslog_message_hostname"]
        target_label: "hostname"

      - source_labels: ["__syslog_message_severity"]
        target_label: "level"

      - source_labels: ["__syslog_message_facility"]
        target_label: "syslog_facility"

  - job_name: switch-syslog
    syslog:
      listen_address: 0.0.0.0:1511
      listen_protocol: udp
      idle_timeout: 60s
      syslog_format: rfc3164
      label_structured_data: false
      labels:
        job: "switch"
        service_name: "switch"
        component: "switch"
    relabel_configs:
      - source_labels: ["__syslog_connection_ip_address"]
        target_label: "source_address"

      - source_labels: ["__syslog_message_hostname"]
        target_label: "hostname"

      - source_labels: ["__syslog_message_severity"]
        target_label: "level"

      - source_labels: ["__syslog_message_facility"]
        target_label: "syslog_facility"

  - job_name: network_devices-syslog
    syslog:
      listen_address: 0.0.0.0:514
      listen_protocol: udp
      idle_timeout: 60s
      label_structured_data: false
      labels:
        job: "network_devices"
        service_name: "network_devices"

    relabel_configs:
      - source_labels: ["__syslog_connection_ip_address"]
        target_label: "source_address"

      - source_labels: ["__syslog_message_hostname"]
        target_label: "hostname"

      - source_labels: ["__syslog_message_severity"]
        target_label: "syslog_severity"

      - source_labels: ["__syslog_message_facility"]
        target_label: "syslog_facility"

  - job_name: server-agent-syslog
    syslog:
      listen_address: 0.0.0.0:2514
      listen_protocol: udp
      idle_timeout: 60s
      syslog_format: rfc3164
      label_structured_data: false
      labels:
        job: "server-agent"
        service_name: "server"
        component: "server"

    relabel_configs:
      - source_labels: ["__syslog_connection_ip_address"]
        target_label: "source_ip"

      - source_labels: ["__syslog_message_hostname"]
        target_label: "hostname"

      - source_labels: ["__syslog_message_severity"]
        target_label: "severity"

      - source_labels: ["__syslog_message_facility"]
        target_label: "facility"

      # Tambah label device_id jika ada dalam message
      - source_labels: ["__syslog_message_app_name"]
        regex: "agent-(.*)"
        target_label: "device_id"
        replacement: "$1"
