version: "3.8"
services:
  ryu-agent-register:
    build: .
    container_name: ryu-agent-register
    environment:
      - RYU_CONTROLLER_URL=http://192.168.221.133:8080 # http:// dan port dari Ryu Manager
      - RYU_API_KEY=agent-secret-token-1 # API Key dari Ryu Manager
      - AGENT_IP=192.168.221.133 # IP Server Agent yang 1 Network atau dapat diPing dengan Server Ryu Manager
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/os-release:/etc/host-os-release:ro
      - /etc/lsb-release:/etc/host-lsb-release:ro
    privileged: true # Untuk Akses command system pada Server
    network_mode: host # Untuk Scanning real network pada Server
    restart: unless-stopped
    command: python3 agent_register.py --verbose

  ryu-agent-api:
    build: .
    container_name: ryu-agent-api
    volumes:
      # Mount proses system
      - /proc:/host/proc:ro # Akses process info host
      - /sys:/host/sys:ro # Akses system info host
      - /var/run/dbus:/var/run/dbus:rw # Akses D-Bus host
      - /run:/run:rw
      # Mount system info
      - /etc/machine-id:/etc/machine-id:ro # Machine ID host
      - /etc/os-release:/etc/host-os-release:ro # OS info host
      - /etc/lsb-release:/etc/host-lsb-release:ro # Distro info host
      - /var/run/docker.sock:/var/run/docker.sock # Mount docker socket
      # Mount host-server root
      - /:/host-rootfs:rw # Mount host filesystem
      # Mount network host-server
      - /etc/netplan:/etc/netplan:rw # Netplan Network Manager
      - /etc/network:/etc/network:rw # Debian Network Manager
      - /etc/systemd/network:/etc/systemd/network:rw # Systemd-Networkd Network Manager
      - /etc/sysconfig/network-scripts:/etc/sysconfig/network-scripts:rw # RHEL/CentOS Network Manager
      # Mount LLDPD host-server
      - /var/run/lldpd:/var/run/lldpd:rw # Akses ke network host untuk LLDPd
      # Mount wazuh host-server
      - /var/ossec:/var/ossec:rw # Wazuh Installation & config
      - /etc/wazuh:/etc/wazuh:rw # Wazuh Configuration
      - /tmp:/tmp:rw # Untuk Wazuh Downloads
      # Mount runner command host-server (Bin)
      - /run/systemd/system:/run/systemd/system:rw # Systemd runtime
      - /usr/sbin/netplan:/usr/sbin/netplan
      - /usr/bin/systemctl:/usr/bin/systemctl
      # Mount nsenter
      - /usr/bin/nsenter:/usr/bin/nsenter:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AGENT_API_PORT=8500 # Untuk Port Koneksi Agent API (Harus sama dengan sisi Manager)
      - AGENT_API_HOST=0.0.0.0 # Untuk Host Receive Agent API
      - AGENT_DEBUG=false # Untuk Debug Mode Agent API
    privileged: true # Untuk Akses command system pada Server
    network_mode: host # Untuk Scanning real network pada Server
    restart: unless-stopped
    # command: python3 agent_api.py --verbose
    command: >
      sh -c "
      echo 'Starting LLDP daemon...' &&
      lldpd -d &
      sleep 3 &&
      echo 'Starting Agent API...' &&
      exec python3 agent_api.py --verbose
      "
    cap_add:
      - SYS_ADMIN # Untuk system operations
      - NET_ADMIN # Untuk system operations
      - SYS_CHROOT

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ryu-agent-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    network_mode: host

  promtail:
    image: grafana/promtail:2.9.6
    container_name: ryu-agent-promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yaml
      - -config.expand-env=true
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
    environment:
      - LOKI_URL=http://192.168.221.133:3100 # IP controller
      - HOSTNAME=ryu-agent # Hostname Server Agent
    restart: unless-stopped
    network_mode: host # Agar bisa kirim log ke controller
    privileged: true # Untuk Akses command system pada Server
